# Fly.io configuration — JobHunter backend
# Free tier: 256MB RAM, 1 shared CPU, 3GB persistent volume
# After running `fly launch` for the first time, this file is auto-generated.
# This is a pre-baked version with sensible defaults.

app = "jobhunter-backend"
primary_region = "mad"  # Madrid — closest to Tenerife with low latency

[build]

[env]
  LOG_LEVEL = "info"
  ENABLE_SCHEDULER = "false"  # Don't run background scrape on free tier

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"   # Free tier: stop when idle (save resources)
  auto_start_machines = true     # Start on incoming request
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[mounts]
  source = "jobhunter_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
