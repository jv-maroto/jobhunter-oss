[project]
name = "jobhunter-backend"
version = "0.1.0"
description = "Backend MVP for automated job search system"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Javier Jose Maroto Dominguez", email = "javidominguez060@gmail.com" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.35",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "apscheduler>=3.10",
    "anthropic>=0.39",
    "python-jobspy>=1.1.79",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=0.3",
]
# Onboarding (Pilar 1): parsing de CV (PDF/DOCX) y subida multipart.
onboarding = [
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
]
# Gmail tracking (Pilar 4): API oficial de Gmail + OAuth desktop.
gmail = [
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
]
# Automatizacion de aplicar (Pilar 3): cliente MCP de descubrimiento (opcional, OFF).
mcp = [
    "mcp>=1.0",
]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
