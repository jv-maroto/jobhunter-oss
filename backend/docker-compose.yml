version: "3.9"

# Opcional: solo cuando migremos de SQLite a Postgres + pgvector.
# Para MVP no es necesario (SQLite vive en ./jobhunter.db).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobhunter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
      POSTGRES_DB: jobhunter
    ports:
      - "5433:5432"
    volumes:
      - jobhunter-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jobhunter-pg-data:
