<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>JobHunter · Opciones</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        margin: 0;
        padding: 40px 24px;
      }
      .container {
        max-width: 520px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 24px 28px;
        box-shadow: 0 4px 18px rgba(15, 23, 42, 0.04);
      }
      h1 { margin: 0 0 4px; font-size: 20px; }
      .sub { color: #64748b; font-size: 13px; margin: 0 0 24px; }
      label.field { display: block; margin-bottom: 18px; font-size: 13px; font-weight: 600; }
      label.field .hint { display: block; font-weight: 400; color: #64748b; margin: 2px 0 8px; font-size: 12px; }
      input[type="text"], input[type="number"], select {
        width: 100%; padding: 8px 10px;
        border: 1px solid #cbd5e1; border-radius: 8px;
        font-size: 13px; background: #f8fafc;
      }
      .toggle { display: flex; align-items: center; gap: 10px; font-size: 13px; }
      .actions { display: flex; gap: 8px; margin-top: 24px; }
      button {
        appearance: none;
        padding: 9px 14px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
      }
      button.primary { background: #2563eb; color: #ffffff; border-color: #2563eb; }
      button.primary:hover { background: #1d4ed8; }
      .status {
        margin-top: 14px;
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 12px;
        display: none;
      }
      .status.ok { background: #ecfdf5; color: #047857; display: block; }
      .status.err { background: #fef2f2; color: #b91c1c; display: block; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>JobHunter · Opciones</h1>
      <p class="sub">Configura cómo se comunica la extensión con tu dashboard local.</p>

      <label class="field">
        Backend URL
        <span class="hint">URL del backend FastAPI (sin barra final).</span>
        <input type="text" id="backend_url" placeholder="http://localhost:8000" />
      </label>

      <label class="field">
        Velocidad de simulación
        <span class="hint">Influye en los delays entre clics y tecleo.</span>
        <select id="sim_speed">
          <option value="slow">Lenta (más humana)</option>
          <option value="normal" selected>Normal</option>
          <option value="fast">Rápida (mayor riesgo)</option>
        </select>
      </label>

      <label class="field">
        Intervalo de polling (segundos)
        <span class="hint">Mínimo recomendado: 30. Chrome obliga &gt;=30 en alarms.</span>
        <input type="number" id="poll_interval_seconds" min="30" max="3600" />
      </label>

      <label class="toggle field">
        <input type="checkbox" id="auto_execute" />
        Auto-ejecutar tareas (si está apagado, requieren clic manual)
      </label>

      <div class="actions">
        <button id="save" class="primary">Guardar</button>
        <button id="test">Probar conexión</button>
      </div>

      <div id="status" class="status"></div>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
