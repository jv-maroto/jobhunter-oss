# Jobslave — persistent local services.
#
# Usage:
#   docker compose up          # start both services
#   docker compose up -d       # detached
#   docker compose down        # stop
#   docker compose logs -f     # follow logs
#
# Data is persisted to ./backend/data on the host
# so the DB survives container restarts and rebuilds.

name: jobslave

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobslave-backend
    # Bind to 127.0.0.1 only — the API has no auth by design (single-user).
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=sqlite:////app/data/jobhunter.db
      - DATA_DIR=/app/data
      - CVS_OUT_DIR=/app/cvs-out
      - CV_MASTER_PATH=/app/app/data/cv_master.json
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000
    volumes:
      # DB + generated PDFs + trending post images persist on host
      - ./backend/data:/app/data
      # Profile and templates; directory mount allows atomic profile updates
      - ./backend/app/data:/app/app/data
      # CV export folder — hooked at generation time to write here
      - ./cvs-out:/app/cvs-out
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: jobslave-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: always
